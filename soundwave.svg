<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Poppins, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow1" cx="10%" cy="0%" r="70%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="0%" r="60%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#0b0816"/>
  <rect width="800" height="500" fill="url(#glow1)"/>
  <rect width="800" height="500" fill="url(#glow2)"/>

  <!-- nav -->
  <g transform="translate(40 34)">
    <rect width="28" height="28" rx="7" fill="#130e24"/>
    <rect x="5" y="12" width="3.5" height="11" rx="1.75" fill="url(#g)"/>
    <rect x="10.5" y="5" width="3.5" height="18" rx="1.75" fill="url(#g)"/>
    <rect x="16" y="9" width="3.5" height="14" rx="1.75" fill="url(#g)"/>
    <rect x="21.5" y="14" width="3.5" height="9" rx="1.75" fill="url(#g)"/>
    <text x="40" y="20" fill="#f4f1ff" font-size="17" font-weight="700">SoundWave</text>
    <text x="470" y="19" fill="#a59fc0" font-size="13">Songs</text>
    <text x="530" y="19" fill="#a59fc0" font-size="13">Artists</text>
    <text x="596" y="19" fill="#a59fc0" font-size="13">Favourites</text>
    <rect x="680" y="2" width="40" height="24" rx="12" fill="url(#g)"/>
  </g>

  <!-- heading -->
  <text x="40" y="118" fill="#f4f1ff" font-size="34" font-weight="800">Your music library</text>
  <text x="40" y="146" fill="#a59fc0" font-size="14">1980s · 1990s · 2000s · Reggae · Indie</text>

  <!-- song rows -->
  <g font-size="14">
    <g transform="translate(40 172)">
      <rect width="720" height="52" rx="12" fill="#ffffff" fill-opacity=".09"/>
      <rect x="10" y="8" width="36" height="36" rx="8" fill="url(#g)"/>
      <text x="60" y="23" fill="#f4f1ff" font-weight="600">Midnight Drive</text>
      <text x="60" y="41" fill="#a59fc0" font-size="12">Neon Coast</text>
      <rect x="430" y="17" width="58" height="20" rx="10" fill="#8b5cf6" fill-opacity=".25"/>
      <text x="459" y="31" fill="#c4b5fd" font-size="11" text-anchor="middle">1980s</text>
      <text x="640" y="31" fill="#ec4899" font-size="16">♥</text>
      <text x="690" y="31" fill="#a59fc0" font-size="12">3:54</text>
    </g>
    <g transform="translate(40 232)">
      <rect width="720" height="52" rx="12" fill="#ffffff" fill-opacity=".05"/>
      <rect x="10" y="8" width="36" height="36" rx="8" fill="#22d3ee" fill-opacity=".7"/>
      <text x="60" y="23" fill="#f4f1ff" font-weight="600">Island Echoes</text>
      <text x="60" y="41" fill="#a59fc0" font-size="12">Roots Collective</text>
      <rect x="430" y="17" width="58" height="20" rx="10" fill="#22c55e" fill-opacity=".22"/>
      <text x="459" y="31" fill="#86efac" font-size="11" text-anchor="middle">Reggae</text>
      <text x="640" y="31" fill="#a59fc0" font-size="16">♡</text>
      <text x="690" y="31" fill="#a59fc0" font-size="12">4:12</text>
    </g>
    <g transform="translate(40 292)">
      <rect width="720" height="52" rx="12" fill="#ffffff" fill-opacity=".05"/>
      <rect x="10" y="8" width="36" height="36" rx="8" fill="#f59e0b" fill-opacity=".75"/>
      <text x="60" y="23" fill="#f4f1ff" font-weight="600">Paper Planes</text>
      <text x="60" y="41" fill="#a59fc0" font-size="12">The Quiet Hours</text>
      <rect x="430" y="17" width="58" height="20" rx="10" fill="#ec4899" fill-opacity=".22"/>
      <text x="459" y="31" fill="#f9a8d4" font-size="11" text-anchor="middle">Indie</text>
      <text x="640" y="31" fill="#ec4899" font-size="16">♥</text>
      <text x="690" y="31" fill="#a59fc0" font-size="12">3:27</text>
    </g>
  </g>

  <!-- player bar -->
  <g transform="translate(0 392)">
    <rect width="800" height="108" fill="#130e24" fill-opacity=".95"/>
    <rect width="800" height="1" fill="#ffffff" fill-opacity=".09"/>
    <rect x="40" y="26" width="56" height="56" rx="10" fill="url(#g)"/>
    <text x="112" y="50" fill="#f4f1ff" font-size="15" font-weight="600">Midnight Drive</text>
    <text x="112" y="70" fill="#a59fc0" font-size="12">Neon Coast</text>
    <!-- controls -->
    <g transform="translate(400 40)" fill="#f4f1ff">
      <path d="M-62 -7 L-72 0 L-62 7 Z M-74 -7 h3 v14 h-3 Z" opacity=".8"/>
      <circle r="17" fill="url(#g)"/>
      <rect x="-6" y="-7" width="4" height="14" rx="1" fill="#fff"/>
      <rect x="2" y="-7" width="4" height="14" rx="1" fill="#fff"/>
      <path d="M62 -7 L72 0 L62 7 Z M74 -7 h-3 v14 h3 Z" transform="translate(0 0)" opacity=".8"/>
    </g>
    <!-- progress -->
    <rect x="290" y="74" width="220" height="4" rx="2" fill="#ffffff" fill-opacity=".15"/>
    <rect x="290" y="74" width="132" height="4" rx="2" fill="url(#g)"/>
    <circle cx="422" cy="76" r="6" fill="#fff"/>
    <!-- equalizer -->
    <g transform="translate(640 30)" fill="url(#g)">
      <rect x="0" y="22" width="8" height="26" rx="4"/>
      <rect x="14" y="6" width="8" height="42" rx="4"/>
      <rect x="28" y="14" width="8" height="34" rx="4"/>
      <rect x="42" y="0" width="8" height="48" rx="4"/>
      <rect x="56" y="18" width="8" height="30" rx="4"/>
      <rect x="70" y="28" width="8" height="20" rx="4"/>
      <rect x="84" y="10" width="8" height="38" rx="4"/>
    </g>
  </g>
</svg>
